[package]
name = "clew"
version = "0.1.0"
edition = "2021"
description = "Flat directory manager with semantic search and backup tracking"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
toml = "0.8"
rand = "0.8"
chrono = "0.4"
libc = "0.2"
